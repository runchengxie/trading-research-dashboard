[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "market-data-service"
version = "0.1.0"
description = "Provider-neutral contracts and service core for live market data"
requires-python = ">=3.11"
dependencies = [
  "alpaca-py>=0.44,<0.45",
  "fastapi>=0.115,<1",
  "redis>=5.0,<9",
  "uvicorn>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/market_data_service"]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.0.3,<10",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires a running Redis instance",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
