[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "trading-research-dashboard-app"
version = "0.1.0"
description = "Trading research dashboard and market-data generators"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "akshare>=1.13",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "pyarrow>=15.0",
  "tushare>=1.2",
  "research-core>=0.1.0",
]

[tool.uv.sources]
research-core = { workspace = true }

[project.urls]
Homepage = "https://github.com/runchengxie/trading-research-dashboard/tree/main/apps/dashboard"

[project.scripts]
rbreaker = "trading_research.strategies.rbreaker:main"
rbreaker-snapshot = "trading_research.scripts.generate_rbreaker_snapshot:main"

[tool.hatch.build.targets.sdist]
include = [
  "README.md",
  "backtest/**",
  "scripts/**",
  "src/trading_research/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trading_research"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
extend-select = ["B", "UP"]

[project.optional-dependencies]
test = [
  "pytest>=9.0.3",
  "pytest-cov>=5.0",
]
backtest = [
  "backtrader>=1.9",
  "exchange-calendars>=4.5,<5",
  "tushare>=1.2",
]
alpaca = [
  "alpaca-py>=0.44,<0.45",
  "exchange-calendars>=4.5,<5",
]

[tool.pytest.ini_options]
addopts = "-ra --cov=trading_research --cov-report=term-missing"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["trading_research"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-cov>=5.0"]
