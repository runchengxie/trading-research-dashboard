name: Deploy Dashboard

on:
  workflow_dispatch:
    inputs:
      research_run_id:
        description: "Research workflow run ID that contains rbreaker-input-v1"
        required: false
        type: string
      artifact_name:
        description: "Name of the R-Breaker input artifact"
        required: true
        default: rbreaker-input-v1
        type: string
      enable_rbreaker:
        description: "Generate the R-Breaker snapshot from the research artifact"
        required: true
        default: true
        type: boolean
      contextual_history:
        description: "Optional comma/newline-separated historical contextual snapshot paths"
        required: false
        default: ""
        type: string
      strategy_outcomes:
        description: "Optional normalized strategy outcome JSON path"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PUBLIC_URL: ${{ vars.CLOUDFLARE_PUBLIC_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Install Dashboard package
        run: uv sync --locked --package trading-research-dashboard-app

      - name: Validate R-Breaker dispatch inputs
        if: ${{ inputs.enable_rbreaker }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ inputs.research_run_id }}" || {
            echo "research_run_id is required when enable_rbreaker=true" >&2
            exit 1
          }

      - name: Download R-Breaker research artifact
        if: ${{ inputs.enable_rbreaker }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          github-token: ${{ secrets.RESEARCH_ARTIFACT_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.research_run_id }}
          path: ${{ runner.temp }}/rbreaker-input

      - name: Install Dashboard backtest dependencies
        if: ${{ inputs.enable_rbreaker }}
        run: uv sync --locked --package trading-research-dashboard-app --extra backtest

      - name: Validate R-Breaker artifact
        if: ${{ inputs.enable_rbreaker }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --package trading-research-dashboard-app --extra backtest python -c \
            "from trading_research.rbreaker_artifact import load_artifact; load_artifact('${{ runner.temp }}/rbreaker-input')"

      - name: Generate R-Breaker research snapshot
        if: ${{ inputs.enable_rbreaker }}
        run: >-
          uv run --locked --package trading-research-dashboard-app --extra backtest rbreaker-snapshot
          --artifact-root "${{ runner.temp }}/rbreaker-input"
          --output apps/dashboard/web/public/rbreaker-research.json
          --producer-run-id "${{ inputs.research_run_id }}"

      - name: Enrich contextual research
        env:
          CONTEXTUAL_HISTORY: ${{ inputs.contextual_history }}
          STRATEGY_OUTCOMES: ${{ inputs.strategy_outcomes }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--input apps/dashboard/web/public/data.json)
          if [ -n "$CONTEXTUAL_HISTORY" ]; then
            while IFS= read -r history_path; do
              [ -n "$history_path" ] || continue
              args+=(--history "$history_path")
            done < <(printf '%s\n' "$CONTEXTUAL_HISTORY" | tr ',' '\n')
          fi
          if [ -n "$STRATEGY_OUTCOMES" ]; then
            args+=(--strategy-outcomes "$STRATEGY_OUTCOMES")
          fi
          uv run --locked --package trading-research-dashboard-app python \
            -m trading_research.scripts.enrich_contextual_research "${args[@]}"

      - name: Skip R-Breaker snapshot generation
        if: ${{ inputs.enable_rbreaker == false }}
        run: |
          echo "### R-Breaker snapshot" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: skipped; using the checked-in static snapshot." >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize R-Breaker generation
        if: ${{ inputs.enable_rbreaker }}
        run: |
          echo "### R-Breaker snapshot" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: generated from research run ${{ inputs.research_run_id }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dashboard dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Dashboard data snapshots
        run: >-
          uv run --locked --package trading-research-dashboard-app python
          apps/dashboard/scripts/validate_static_assets.py --require-contextual

      - name: Test Dashboard
        run: pnpm --filter wu-t0-dashboard-web test

      - name: Build Dashboard
        run: pnpm --filter wu-t0-dashboard-web build

      - name: Upload Dashboard to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dashboard/web/dist

      - name: Deploy Dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy to Cloudflare Workers Static Assets
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: pnpm dlx wrangler@4 deploy --config apps/dashboard/wrangler.jsonc

      - name: Check deployed Dashboard
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_PUBLIC_URL != '' }}
        run: |
          check_args=("$CLOUDFLARE_PUBLIC_URL")
          if [ "${{ inputs.enable_rbreaker }}" = "true" ]; then
            check_args+=("--require-rbreaker")
          fi
          python apps/dashboard/scripts/check_deployment.py "${check_args[@]}"

      - name: Explain skipped deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "Dashboard snapshot validation, tests, and build passed. Cloudflare deployment was skipped."
          echo "Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable deployment."

      - name: Explain skipped deployment check
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_PUBLIC_URL == '' }}
        run: |
          echo "Dashboard deployment finished, but the post-deploy check was skipped."
          echo "Configure CLOUDFLARE_PUBLIC_URL to enable the deployment smoke check."
