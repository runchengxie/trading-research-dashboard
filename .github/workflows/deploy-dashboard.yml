name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/web/**"
      - "apps/dashboard/wrangler.jsonc"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/web/package-lock.json

      - name: Install Dashboard dependencies
        run: npm ci --prefix apps/dashboard/web

      - name: Build Dashboard
        run: npm run build --prefix apps/dashboard/web

      - name: Deploy to Cloudflare Workers Static Assets
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --yes wrangler@4 deploy --config apps/dashboard/wrangler.jsonc

      - name: Explain skipped deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "Dashboard build passed. Cloudflare deployment was skipped."
          echo "Configure the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID repository variable to enable deployment."
