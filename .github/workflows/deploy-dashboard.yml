name: Deploy Dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PUBLIC_URL: ${{ vars.CLOUDFLARE_PUBLIC_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/web/package-lock.json

      - name: Install Dashboard dependencies
        run: npm ci --prefix apps/dashboard/web

      - name: Validate Dashboard data snapshots
        run: python apps/dashboard/scripts/validate_static_assets.py

      - name: Test Dashboard
        run: npm test --prefix apps/dashboard/web

      - name: Build Dashboard
        run: npm run build --prefix apps/dashboard/web

      - name: Deploy to Cloudflare Workers Static Assets
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --yes wrangler@4 deploy --config apps/dashboard/wrangler.jsonc

      - name: Check deployed Dashboard
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_PUBLIC_URL != '' }}
        run: python apps/dashboard/scripts/check_deployment.py "$CLOUDFLARE_PUBLIC_URL"

      - name: Explain skipped deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "Dashboard snapshot validation, tests, and build passed. Cloudflare deployment was skipped."
          echo "Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable deployment."

      - name: Explain skipped deployment check
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_PUBLIC_URL == '' }}
        run: |
          echo "Dashboard deployment finished, but the post-deploy check was skipped."
          echo "Configure CLOUDFLARE_PUBLIC_URL to enable the deployment smoke check."
