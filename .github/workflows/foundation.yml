name: Monorepo foundation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
          python-version: "3.11"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check workspace lockfile
        run: uv lock --check

      - name: Run Python lint
        run: >-
          uvx --from ruff==0.16.4 ruff check
          --select E4,E7,E9,F
          scripts tests apps/dashboard/scripts apps/dashboard/src apps/dashboard/tests

      - name: Run foundation tests
        run: uv run --locked --extra dev pytest -q

      - name: Run Dashboard Python tests with coverage
        working-directory: apps/dashboard
        run: uv run --locked --extra backtest pytest -q

      - name: Run Dashboard type checks
        working-directory: apps/dashboard
        run: uv run --locked --extra backtest --extra alpaca --with ty ty check src

      - name: Enforce Dashboard coverage baseline
        working-directory: apps/dashboard
        run: uv run --locked --extra backtest coverage report --fail-under=60

      - name: Run Dashboard lint
        working-directory: apps/dashboard
        run: uv run --locked ruff check src scripts tests

      - name: Run research core tests and lint
        working-directory: packages/research-core
        run: |
          uv run --locked pytest -q
          uv run --locked ruff check src tests

      - name: Run market data service tests
        working-directory: apps/market-data-service
        run: uv run --locked pytest -q

      - name: Run market data service lint
        working-directory: apps/market-data-service
        run: uv run --locked ruff check src tests

      - name: Run Niu Men Python tests
        working-directory: packages/niu-men-line-strategy
        run: uv run --locked --extra dev pytest

      - name: Run Niu Men lint and type checks
        working-directory: packages/niu-men-line-strategy
        run: |
          uv run --locked --extra dev ruff check .
          uv run --locked --extra dev ruff format --check .
          uv run --locked --extra dev ty check src

      - name: Run Niu Men coverage gate
        working-directory: packages/niu-men-line-strategy
        run: |
          uv run --locked --extra dev coverage run -m pytest
          uv run --locked --extra dev coverage report --fail-under=80

      - name: Audit workspace Python dependencies
        run: >-
          uv run --locked --all-packages --all-extras
          --with pip-audit==2.10.1 pip-audit --progress-spinner off

      - name: Install Dashboard Web dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Dashboard Web unit tests
        run: pnpm --filter wu-t0-dashboard-web test

      - name: Build Dashboard Web
        run: pnpm --filter wu-t0-dashboard-web build

      - name: Audit Dashboard Web dependencies
        run: pnpm audit --audit-level high

      - name: Run foundation boundary check
        run: uv run --locked python scripts/check_foundation.py

      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff-tree --check --no-commit-id -r "$HEAD_SHA"
          fi
