name: Monorepo foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
          python-version: "3.11"

      - name: Check lockfile
        run: uv lock --check

      - name: Run foundation tests
        run: uv run --locked --extra dev pytest -q

      - name: Run Dashboard Python tests
        run: uv run --project apps/dashboard --locked pytest -q apps/dashboard/tests

      - name: Run foundation boundary check
        run: uv run --locked python scripts/check_foundation.py

      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff-tree --check --no-commit-id -r "$HEAD_SHA"
          fi
