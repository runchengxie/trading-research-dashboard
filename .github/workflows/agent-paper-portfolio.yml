name: Agent paper portfolio

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Optional YYYY-MM-DD override for offline replay"
        required: false
        type: string
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: read

concurrency:
  group: agent-paper-portfolio
  cancel-in-progress: false

jobs:
  paper-portfolio:
    runs-on: ubuntu-latest
    env:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
      OPENROUTER_BASE_URL: ${{ vars.OPENROUTER_BASE_URL || 'https://openrouter.ai/api/v1' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PUBLIC_URL: ${{ vars.CLOUDFLARE_PUBLIC_URL }}
      AS_OF_OVERRIDE: ${{ inputs.as_of }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.12.5
          python-version: "3.11"

      - name: Install Dashboard package
        run: uv sync --locked --package trading-research-dashboard-app

      - name: Fetch paper portfolio prices
        run: uv run --locked --package trading-research-dashboard-app agent-prices --output "$RUNNER_TEMP/agent-prices.json"

      - name: Resolve previous portfolio state
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_PUBLIC_URL" ]; then
            if ! curl --fail --silent --show-error --connect-timeout 5 --max-time 20 \
              "$CLOUDFLARE_PUBLIC_URL/agent/latest.json" \
              -o "$RUNNER_TEMP/previous-agent.json"; then
              echo "Unable to load the previous deployed Agent portfolio state." >&2
              exit 1
            fi
            echo "Loaded the previous deployed Agent portfolio state."
          else
            cp apps/dashboard/web/public/agent/latest.json "$RUNNER_TEMP/previous-agent.json"
            echo "Using the reviewed checked-in Agent portfolio seed."
          fi

      - name: Resolve decision date
        id: date
        shell: bash
        run: |
          set -euo pipefail
          as_of="$(python -c 'import json, pathlib; print(json.loads(pathlib.Path("'"$RUNNER_TEMP"'/agent-prices.json").read_text())["asOf"])')"
          if [ -n "$AS_OF_OVERRIDE" ]; then as_of="$AS_OF_OVERRIDE"; fi
          python - "$as_of" <<'PY'
          import datetime
          import sys

          try:
              datetime.date.fromisoformat(sys.argv[1])
          except ValueError as exc:
              raise SystemExit("as_of must be YYYY-MM-DD") from exc
          PY
          echo "as_of=$as_of" >> "$GITHUB_OUTPUT"
          echo "Paper decision date: $as_of" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Agent paper decision
        run: >-
          uv run --locked --package trading-research-dashboard-app agent-portfolio
          --prices "$RUNNER_TEMP/agent-prices.json"
          --previous "$RUNNER_TEMP/previous-agent.json"
          --output "$RUNNER_TEMP/latest-agent.json"
          --as-of "$AS_OF"
          --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        env:
          AS_OF: ${{ steps.date.outputs.as_of }}

      - name: Stage validated Agent snapshot
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/latest-agent.json" apps/dashboard/web/public/agent/latest.json
          python - <<'PY'
          import json
          from pathlib import Path

          latest = json.loads(Path("apps/dashboard/web/public/agent/latest.json").read_text())
          root = Path("apps/dashboard/web/public/agent")
          (root / "history.json").write_text(json.dumps(latest["history"], ensure_ascii=False, indent=2) + "\n")
          decision = dict(latest["decision"])
          decision["asOf"] = latest["asOf"]
          decision["model"] = latest["agent"]["model"]
          (root / "decisions.json").write_text(json.dumps([decision], ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Validate Agent snapshot and static assets
        run: uv run --locked --package trading-research-dashboard-app python apps/dashboard/scripts/validate_static_assets.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dashboard web dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Dashboard web
        run: pnpm --filter wu-t0-dashboard-web test

      - name: Build Dashboard web
        run: pnpm --filter wu-t0-dashboard-web build

      - name: Upload Agent paper portfolio artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-paper-portfolio-${{ github.run_id }}
          path: |
            apps/dashboard/web/public/agent/latest.json
            apps/dashboard/web/public/agent/history.json
            apps/dashboard/web/public/agent/decisions.json
            ${{ runner.temp }}/agent-prices.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate Cloudflare deployment configuration
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_PUBLIC_URL != '' }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_PUBLIC_URL"

      - name: Deploy paper portfolio Dashboard
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_PUBLIC_URL != '' }}
        run: npx --yes wrangler@4.127.1 deploy --config apps/dashboard/wrangler.jsonc
