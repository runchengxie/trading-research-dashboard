name: Agent paper portfolio

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Optional YYYY-MM-DD override for offline replay"
        required: false
        type: string
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dashboard-publish
  cancel-in-progress: false

jobs:
  paper-portfolio:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
      OPENROUTER_BASE_URL: ${{ vars.OPENROUTER_BASE_URL || 'https://openrouter.ai/api/v1' }}
      TUSHARE_TOKEN_2: ${{ secrets.TUSHARE_TOKEN_2 }}
      TUSHARE_API_URL_2: ${{ secrets.TUSHARE_API_URL_2 }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TUSHARE_API_URL: ${{ secrets.TUSHARE_API_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PUBLIC_URL: ${{ vars.CLOUDFLARE_PUBLIC_URL }}
      AS_OF_OVERRIDE: ${{ inputs.as_of }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.12.5
          python-version: "3.11"

      - name: Install Dashboard package
        run: uv sync --locked --package trading-research-dashboard-app

      - name: Fetch paper portfolio prices
        run: |
          set -euo pipefail
          for universe in etf stocks; do
            uv run --locked --package trading-research-dashboard-app agent-prices \
              --universe "$universe" \
              --output "$RUNNER_TEMP/agent-prices-$universe.json"
          done

      - name: Resolve previous portfolio state
        shell: bash
        run: |
          set -euo pipefail
          for universe in etf stocks; do
            if [ -n "$CLOUDFLARE_PUBLIC_URL" ] && curl --fail --silent --show-error --connect-timeout 5 --max-time 20 \
              "$CLOUDFLARE_PUBLIC_URL/agent/$universe/latest.json" \
              -o "$RUNNER_TEMP/previous-agent-$universe.json"; then
              echo "Loaded the previous deployed $universe Agent portfolio state."
            else
              cp "apps/dashboard/web/public/agent/$universe/latest.json" "$RUNNER_TEMP/previous-agent-$universe.json"
              echo "Using the reviewed $universe Agent portfolio seed."
            fi
          done

      - name: Resolve decision date
        id: date
        shell: bash
        run: |
          set -euo pipefail
          as_of="$(python -c 'import json, pathlib; print(json.loads(pathlib.Path("'"$RUNNER_TEMP"'/agent-prices-etf.json").read_text())["asOf"])')"
          if [ -n "$AS_OF_OVERRIDE" ]; then as_of="$AS_OF_OVERRIDE"; fi
          python - "$as_of" <<'PY'
          import datetime
          import sys

          try:
              datetime.date.fromisoformat(sys.argv[1])
          except ValueError as exc:
              raise SystemExit("as_of must be YYYY-MM-DD") from exc
          PY
          echo "as_of=$as_of" >> "$GITHUB_OUTPUT"
          echo "Paper decision date: $as_of" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Agent paper decision
        run: |
          set -euo pipefail
          for universe in etf stocks; do
            uv run --locked --package trading-research-dashboard-app agent-portfolio \
              --prices "$RUNNER_TEMP/agent-prices-$universe.json" \
              --previous "$RUNNER_TEMP/previous-agent-$universe.json" \
              --output "$RUNNER_TEMP/latest-agent-$universe.json" \
              --as-of "$AS_OF" \
              --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          done
        env:
          AS_OF: ${{ steps.date.outputs.as_of }}

      - name: Stage validated Agent snapshot
        shell: bash
        run: |
          set -euo pipefail
          for universe in etf stocks; do
            mkdir -p "apps/dashboard/web/public/agent/$universe"
            cp "$RUNNER_TEMP/latest-agent-$universe.json" "apps/dashboard/web/public/agent/$universe/latest.json"
          done
          cp "$RUNNER_TEMP/latest-agent-etf.json" apps/dashboard/web/public/agent/latest.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("apps/dashboard/web/public/agent")
          for universe in ("etf", "stocks"):
              latest = json.loads((root / universe / "latest.json").read_text())
              (root / universe / "history.json").write_text(json.dumps(latest["history"], ensure_ascii=False, indent=2) + "\n")
              decision = dict(latest["decision"])
              decision["asOf"] = latest["asOf"]
              decision["model"] = latest["agent"]["model"]
              (root / universe / "decisions.json").write_text(json.dumps([decision], ensure_ascii=False, indent=2) + "\n")
          latest = json.loads((root / "latest.json").read_text())
          (root / "history.json").write_text(json.dumps(latest["history"], ensure_ascii=False, indent=2) + "\n")
          decision = dict(latest["decision"])
          decision["asOf"] = latest["asOf"]
          decision["model"] = latest["agent"]["model"]
          (root / "decisions.json").write_text(json.dumps([decision], ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Validate Agent snapshot and static assets
        run: uv run --locked --package trading-research-dashboard-app python apps/dashboard/scripts/validate_static_assets.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dashboard web dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Dashboard web
        run: pnpm --filter wu-t0-dashboard-web test

      - name: Build Dashboard web
        run: pnpm --filter wu-t0-dashboard-web build

      - name: Upload Dashboard to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/dashboard/web/dist

      - name: Deploy Dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Upload Agent paper portfolio artifact
        uses: actions/upload-artifact@v7
        with:
          name: agent-paper-portfolio-${{ github.run_id }}
          path: |
            apps/dashboard/web/public/agent/latest.json
            apps/dashboard/web/public/agent/history.json
            apps/dashboard/web/public/agent/decisions.json
            apps/dashboard/web/public/agent/etf/
            apps/dashboard/web/public/agent/stocks/
            ${{ runner.temp }}/agent-prices-etf.json
            ${{ runner.temp }}/agent-prices-stocks.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate Cloudflare deployment configuration
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_PUBLIC_URL != '' }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_PUBLIC_URL"

      - name: Deploy paper portfolio Dashboard
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_PUBLIC_URL != '' }}
        run: npx --yes wrangler@4.127.1 deploy --config apps/dashboard/wrangler.jsonc
