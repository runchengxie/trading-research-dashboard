[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "niu-men-line-strategy"
version = "0.1.0"
description = "Research implementation of the Niu Men Line strategy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6",
  "pip-audit>=2.7",
  "pytest>=8.3",
  "ruff>=0.9",
  "ty>=0.0.1",
]

[project.scripts]
niu-men-backtest = "niu_men_line_strategy.cli:main"
niu-men-experiments = "niu_men_line_strategy.experiments:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "TRY"]
ignore = ["RUF001", "TRY003"]

[tool.coverage.run]
branch = true
source = ["src/niu_men_line_strategy"]

[tool.coverage.report]
show_missing = true
skip_covered = true
