[project]
name = "trading-research-dashboard"
version = "0.0.0"
description = "Trading research and dashboard integration monorepo"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "research-core>=0.1.0"]

[tool.uv]
package = false

[tool.uv.sources]
research-core = { workspace = true }

[tool.uv.workspace]
members = [
  "apps/dashboard",
  "packages/research-core",
  "packages/niu-men-line-strategy",
  "apps/market-data-service",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
